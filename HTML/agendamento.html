<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | Rokuzen</title>
  <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">

  <script src="/JavaScript/agendamento.js" defer></script>
  <link href="CSS/agendamento.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
  <script src="https://kit.fontawesome.com/e64e449d7c.js" crossorigin="anonymous"></script>
</head>

<body>
  <!--Barra de navegação-->
  <nav class="navbar navbar-expand-xxl fixed-top">
    <div class="container-fluid box">
      <div class="logo">
        <img src="/Imagens/logo-rokuzen.png" width="160px" alt="Logo Rokuzen">
      </div>

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
        aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
        aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/HTML/quemSomos.html">Quem somos</a></li>
            <li class="nav-item"><a class="nav-link" href="/HTML/unidades.html">Unidades</a></li>
            <li class="nav-item"><a class="nav-link" href="/HTML/noticia.html">Notícias</a></li>
            <li class="nav-item"><a class="nav-link" href="/HTML/servicos.html">Serviços</a></li>
            <li class="nav-item"><a class="nav-link" href="/HTML/faleConosco.html">Fale Conosco</a></li>

            <li class="nav-item">
              <a href="/Login/login.html" class="login-button login-button-rounded"><i class="fa-solid fa-user"></i></a>
            </li>
            <li class="nav-item">
              <a href="/HTML/agendamento.html" class="agende-button"><b>Agende um horário</b></a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!--Banner-->
  <div id="bannerAgendamento" class="carousel slide w-100" data-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <div class="overlay-image" style="background-image:url(../Imagens/banner-agendamento.jpg);"></div>
        <div class="container text-white">
          <h1 style="margin-left: 10%; margin-top: 150px;">Agende sua Sessão</h1>
          <p style="margin-left: 10%;">Escolha a unidade, o tipo e a duração da sua massagem.<br>Descubra o equilíbrio entre corpo e mente.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Seção de agendamento -->
  <section class="container my-5">
    <h2 class="text-center mb-4">Formulário de Agendamento</h2>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form class="p-4 shadow rounded bg-light">
          <div class="form-group mb-3">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome" required>
          </div>

          <div class="form-group mb-3">
            <label for="telefone">Telefone / WhatsApp</label>
            <input type="tel" id="telefone" name="telefone" class="form-control" placeholder="(00) 00000-0000" required>
          </div>

          <div class="form-group mb-3">
            <label for="unidade">Unidade</label>
            <select id="unidade" name="unidade" class="form-control" required>
              <option value="">Selecione a unidade</option>
              <option value="São Bernardo do Campo">São Bernado</option>
              <option value="Santo André">Santo André</option>
              <option value="São Paulo-Mooca">São Paulo-Mocca</option>
              <option value="São Paulo">São Paulo</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="massagem">Tipo de massagem</label>
            <select id="massagem" name="massagem" class="form-control" required disabled>
              <option value="">Selecione a unidade primeiro</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="tempo">Tempo da sessão</label>
            <select id="tempo" name="tempo" class="form-control" required disabled>
              <option value="">Selecione o tipo de massagem primeiro</option>
            </select>
          </div>

          <div class="form-group text-center mb-4">
            <h4 id="preco" class="text-success"></h4>
          </div>

          <div class="form-group mb-3">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" class="form-control" required>
          </div>

          <div class="form-group mb-4">
            <label for="hora">Horário</label>
            <input type="time" id="hora" name="hora" class="form-control" required>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-success px-5">Confirmar Agendamento</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer class="text-center py-4 bg-dark text-white">
    <p>© 2025 Rokuzen | Todos os direitos reservados.</p>
  </footer>

  <script>
    const precos = {
      "QUICK MASSAGE": {
        "15 minutos": "R$ 52,00",
        "25 minutos": "R$ 73,00",
        "35 minutos": "R$ 92,00"
      },
      "MACA": {
        "30 minutos": "R$ 114,00",
        "45 minutos": "R$ 160,00",
        "60 minutos": "R$ 198,00",
        "90 minutos": "R$ 292,00",
        "120 minutos": "R$ 379,00"
      },
      "REFLEXOLOGIA PODAL": {
        "20 minutos": "R$ 83,00",
        "30 minutos": "R$ 99,00",
        "40 minutos": "R$ 118,00",
        "60 minutos": "R$ 159,00"
      },
      "AURICULOTERAPIA": {
        "10 minutos": "R$ 69,00"
      }
    };

    const unidadeSelect = document.getElementById("unidade");
    const massagemSelect = document.getElementById("massagem");
    const tempoSelect = document.getElementById("tempo");
    const precoEl = document.getElementById("preco");

    unidadeSelect.addEventListener("change", () => {
      massagemSelect.innerHTML = '<option value="">Selecione o tipo de massagem</option>';
      tempoSelect.innerHTML = '<option value="">Selecione o tipo de massagem primeiro</option>';
      tempoSelect.disabled = true;
      precoEl.textContent = "";

      if (unidadeSelect.value) {
        massagemSelect.disabled = false;
        Object.keys(precos).forEach(tipo => {
          const opt = document.createElement("option");
          opt.value = tipo;
          opt.textContent = tipo;
          massagemSelect.appendChild(opt);
        });
      } else {
        massagemSelect.disabled = true;
      }
    });

    massagemSelect.addEventListener("change", () => {
      tempoSelect.innerHTML = '<option value="">Selecione o tempo</option>';
      precoEl.textContent = "";
      tempoSelect.disabled = false;

      const tipo = massagemSelect.value;
      if (precos[tipo]) {
        Object.entries(precos[tipo]).forEach(([tempo, preco]) => {
          const opt = document.createElement("option");
          opt.value = tempo;
          opt.textContent = `${tempo} - ${preco}`;
          tempoSelect.appendChild(opt);
        });
      }
    });

    tempoSelect.addEventListener("change", () => {
      const tipo = massagemSelect.value;
      const tempo = tempoSelect.value;
      precoEl.textContent = tempo ? `Preço: ${precos[tipo][tempo]}` : "";
    });
  </script>
</body>
</html>
