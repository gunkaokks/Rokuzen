<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | Rokuzen</title>

  <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">
  <link href="CSS/agendamento.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">
        <img src="../Imagens/logo-rokuzen.png" width="150" alt="Rokuzen Logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="quemSomos.html">Quem somos</a></li>
          <li class="nav-item"><a class="nav-link" href="unidades.html">Unidades</a></li>
          <li class="nav-item"><a class="nav-link" href="noticia.html">Notícias</a></li>
          <li class="nav-item"><a class="nav-link" href="servicos.html">Serviços</a></li>
          <li class="nav-item"><a class="nav-link" href="faleConosco.html">Fale Conosco</a></li>
          <li class="nav-item">
            <a href="../Login/login.html" class="btn btn-outline-success rounded-circle">
              <i class="fa-solid fa-user"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="agendamento-container">
    <h2 class="text-center mb-4">Agende seu horário</h2>

    <form id="formAgendamento">
      <label for="unidade" class="form-label">Selecione a unidade</label>
      <select id="unidade" class="form-select" required>
        <option selected disabled value="">Escolha...</option>
        <option value="Santo André">Santo André</option>
        <option value="São Bernardo do Campo">São Bernardo do Campo</option>
        <option value="São Paulo">São Paulo</option>
        <option value="Mooca">Mooca</option>
      </select>

      <label for="tipo" class="form-label">Tipo de massagem</label>
      <select id="tipo" class="form-select" required>
        <option selected disabled value="">Escolha...</option>
        <option value="quick">Quick Massage</option>
        <option value="maca">Massagem na Maca</option>
        <option value="reflexo">Reflexologia Podal</option>
        <option value="auriculo">Auriculoterapia</option>
      </select>

      <label for="tempo" class="form-label">Duração</label>
      <select id="tempo" class="form-select" required></select>

      <label for="data" class="form-label">Data</label>
      <input type="date" id="data" class="form-control" required>

      <label for="hora" class="form-label">Horário</label>
      <input type="time" id="hora" class="form-control" required>

      <div class="preco" id="preco"></div>

      <button type="submit" class="btn btn-success w-100 mt-3">Confirmar Agendamento</button>
    </form>
  </div>

  <script>
    const opcoes = {
      quick: { "15 minutos": 52, "25 minutos": 73, "35 minutos": 92 },
      maca: { "30 minutos": 114, "45 minutos": 160, "60 minutos": 198, "90 minutos": 292, "120 minutos": 379 },
      reflexo: { "20 minutos": 83, "30 minutos": 99, "40 minutos": 118, "60 minutos": 159 },
      auriculo: { "10 minutos": 69 }
    };

    const tipoSelect = document.getElementById("tipo");
    const tempoSelect = document.getElementById("tempo");
    const preco = document.getElementById("preco");
    const form = document.getElementById("formAgendamento");

    tipoSelect.addEventListener("change", () => {
      tempoSelect.innerHTML = "<option disabled selected>Escolha...</option>";
      const tipo = tipoSelect.value;
      if (opcoes[tipo]) {
        Object.keys(opcoes[tipo]).forEach(t => {
          const option = document.createElement("option");
          option.value = t;
          option.textContent = t;
          tempoSelect.appendChild(option);
        });
      }
      preco.textContent = "";
    });

    tempoSelect.addEventListener("change", () => {
      const tipo = tipoSelect.value;
      const tempo = tempoSelect.value;
      if (opcoes[tipo] && opcoes[tipo][tempo]) {
        preco.textContent = `Valor: R$ ${opcoes[tipo][tempo].toFixed(2).replace('.', ',')}`;
      }
    });

    form.addEventListener("submit", e => {
      e.preventDefault();
      const unidade = document.getElementById("unidade").value;
      const tipo = tipoSelect.options[tipoSelect.selectedIndex].text;
      const tempo = tempoSelect.value;
      const data = document.getElementById("data").value;
      const hora = document.getElementById("hora").value;

      if (unidade && tipo && tempo && data && hora) {
        alert(`✅ Agendamento confirmado!\n\nUnidade: ${unidade}\nMassagem: ${tipo}\nDuração: ${tempo}\nData: ${data}\nHorário: ${hora}\n${preco.textContent}`);
        form.reset();
        preco.textContent = "";
      }
    });
  </script>
</body>

</html>
