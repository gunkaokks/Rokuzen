<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokuzen</title>
    <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones -->
    <script src="https://kit.fontawesome.com/e64e449d7c.js" crossorigin="anonymous"></script>
    <link href="../CSS/gerente.css" rel="stylesheet">
    <script src="https://app.embed.im/accessibility.js" defer></script>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</head>

<body>
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-xxl fixed-top">
        <div class="container-fluid box">
            <div class="logo">
                <a href="../index.html"><img src="../Imagens/logo-rokuzen.png" width="160px" alt="Logo Rokuzen"></a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="/HTML/gerenteAgendamentos.html">Agendamentos</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/gerenteFuncionarios.html">Funcionários</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/gerenteUsuarios.html">Usuários</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/gerenteRelatorios.html">Relatórios</a></li>
                        <li class="nav-item">
                            <a href="/HTML/perfilGerente.html" id="loginProfileLink"
                                class="login-button login-button-rounded login-profile-link">
                                <i class="fa-solid fa-user"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <div class="container-missao fade-in">
        <div class="missao-titulo">Funcionários</div>

        <!--Divisória-->
        <div class="col-md-8 mx-auto fade-in">
            <hr>
        </div>

        <!-- Painel de Funcionários -->
        <div class="container mt-5 mb-5">
            <div class="card shadow">
                <div class="card-header gerente-card text-white d-flex justify-content-between align-items-center">
                    <a href="gerente.html" class="btn btn-light">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </a>
                    <button class="btn btn-light" onclick="abrirModalCadastro()">
                        <i class="fas fa-plus"></i> Novo Funcionário
                    </button>
                </div>

                <div class="card-body">
                    <!-- Barra de Pesquisa -->
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="input-group">
                                <input type="text" class="form-control" id="pesquisa-funcionarios"
                                    placeholder="Pesquisar funcionários...">
                                <span class="input-group-text">
                                    <i class="fas fa-search"></i>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Tabela de Funcionários -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="tabela-funcionarios">
                            <thead class="table-light">
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Ocupação</th>
                                    <th>Especialidade</th>
                                    <th>Unidade</th>
                                    <th>Criado em</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="corpo-tabela-funcionarios">
                                <!-- Dados serão carregados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal para Cadastro -->
        <div class="modal fade" id="modalCadastroFuncionario" tabindex="-1"
            aria-labelledby="modalCadastroFuncionarioLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header gerente-card text-white">
                        <h5 class="modal-title" id="modalCadastroFuncionarioLabel">Cadastrar Novo Funcionário</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="form-cadastro-funcionario">
                            <div class="mb-3">
                                <label for="nome-cadastro" class="form-label">Nome *</label>
                                <input type="text" class="form-control" id="nome-cadastro" required>
                            </div>
                            <div class="mb-3">
                                <label for="email-cadastro" class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email-cadastro" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefone-cadastro" class="form-label">Telefone *</label>
                                <input type="tel" class="form-control" id="telefone-cadastro" required>
                            </div>
                            <div class="mb-3">
                                <label for="tipo-cadastro" class="form-label">Tipo *</label>
                                <select class="form-control" id="tipo-cadastro" required>
                                    <option value="">Selecione o tipo</option>
                                    <option value="recepcionista">Recepcionista</option>
                                    <option value="terapeuta">Terapeuta</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="especialidades-cadastro" class="form-label">Especialidades</label>
                                <input type="text" class="form-control" id="especialidades-cadastro"
                                    placeholder="Separe por vírgula (ex: Massagem, Acupuntura)">
                            </div>
                            <div class="mb-3">
                                <label for="unidade-cadastro" class="form-label">Unidade</label>
                                <select class="form-control" id="unidade-cadastro">
                                    <option value="">Selecione a unidade</option>
                                    <!-- Unidades serão carregadas via JavaScript -->
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-gerente-card"
                            id="salvarCadastroFuncionario">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal para Edição -->
        <div class="modal fade" id="modalEdicaoFuncionario" tabindex="-1" aria-labelledby="modalEdicaoFuncionarioLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header gerente-card text-white">
                        <h5 class="modal-title" id="modalEdicaoFuncionarioLabel">Editar Funcionário</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="modalEdicaoFuncionarioCorpo">
                        <!-- Conteúdo será carregado via JavaScript -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-gerente-card" id="salvarEdicaoFuncionario">Salvar
                            Alterações</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Scripts Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../JavaScript/gerenteFuncionarios.js"></script>
</body>

</html>
