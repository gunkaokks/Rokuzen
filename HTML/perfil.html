<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Rokuzen</title>
    <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">

    <link href="../CSS/perfil.css" rel="stylesheet"> <!-- Crie este arquivo CSS -->
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <!--Ícones da página-->
    <script src="https://kit.fontawesome.com/e64e449d7c.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
        crossorigin="anonymous"></script>

    <!--Barra de navegação-->
    <nav class="navbar navbar-expand-xxl fixed-top">
        <div class="container-fluid box">
            <div class="logo">
                <a href="../index.html"><img src="../Imagens/logo-rokuzen.png" width="160px" alt="Logo Rokuzen"></a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link" href="/HTML/quemSomos.html">Quem somos</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/unidades.html">Unidades</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/noticias.html">Notícias</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/servicos.html">Serviços</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/faleConosco.html">Fale conosco</a></li>
                        <li class="nav-item">
                            <a href="#" id="loginProfileLink" class="login-button login-button-rounded">
                                <i class="fa-solid fa-user"></i>
                            </a>
                        </li>
                        <li class="nav-item"><a href="/HTML/agendamento.html" class="agende-button"><b>Agende um
                                    horário</b></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-missao fade-in">
        <div class="missao-titulo">Meu Perfil</div>

        <!--Divisória-->
        <div class="col-md-8 mx-auto fade-in">
            <hr style="border-top: 1px solid #c1c1c1; ">
        </div>

        <!-- Conteúdo do Perfil -->
        <div class="container mt-5 pt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <!-- Card de Informações Pessoais -->
                    <div class="card profile-card fade-in">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-user me-2"></i>Informações Pessoais</h3>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label>Nome:</label>
                                        <p id="userName">Carregando...</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label>Email:</label>
                                        <p id="userEmail">Carregando...</p>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label>Telefone:</label>
                                        <p id="userPhone">Carregando...</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="info-item">
                                        <label>Data de Cadastro:</label>
                                        <p id="userSince">Carregando...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Card de Agendamentos -->
                    <div class="card profile-card fade-in mt-4">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-calendar me-2"></i>Meus Agendamentos</h3>
                        </div>
                        <div class="card-body">
                            <div id="userAppointments">
                                <p class="text-muted">Nenhum agendamento encontrado.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Ações do Perfil -->
                    <div class="profile-actions mt-4 text-center">
                        <button id="editProfileBtn" class="btn btn-primary me-2">
                            <i class="fa-solid fa-pen-to-square me-1"></i>Editar Perfil
                        </button>
                        <button id="logoutBtn" class="btn btn-danger">
                            <i class="fa-solid fa-right-from-bracket me-1"></i>Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição de Perfil -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label for="editName" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="editPhone" class="form-label">Telefone</label>
                            <input type="tel" class="form-control" id="editPhone" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveProfileBtn">Salvar Alterações</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/JavaScript/perfil.js"></script>
    <script src="/JavaScript/home.js"></script>
</body>

</html>
