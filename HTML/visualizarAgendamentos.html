<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokuzen</title>
    <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous"-->
    <!--Ícones da página-->
    <script src="https://kit.fontawesome.com/e64e449d7c.js" crossorigin="anonymous"></script>
    <!--Plugin de acessibilidade-->
    <!--<script src="https://cdn.userway.org/widget.js" data-account="9AycmX4hek"></script>-->
    <link rel="stylesheet" href="../CSS/terapeuta.css">
</head>

<body>
    <nav class="navbar navbar-expand-xxl fixed-top">
        <div class="container-fluid box">
            <div class="logo">
                <a href="../index.html"><img src="../Imagens/logo-rokuzen.png" width="160px" alt="Logo Rokuzen"></a>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item"><a class="nav-link"
                                href="/HTML/visualizarAgendamentos.html">Agendamentos</a></li>
                        <li class="nav-item"><a class="nav-link" href="/HTML/relatoriosTerapeuta.html">Relatórios</a>
                        </li>
                        <li class="nav-item">
                            <a href="perfilColaborador.html" id="loginProfileLink"
                                class="login-button login-button-rounded login-profile-link">
                                <i class="fa-solid fa-user"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-missao fade-in">
        <div class="missao-titulo">Agendamentos</div>

        <!--Divisória-->
        <div class="col-md-8 mx-auto fade-in">
            <hr style="border-top: 1px solid #c1c1c1; margin-top:1.5%">
        </div>

        <div class="row">
            <!-- Coluna de Agendamentos -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fa-solid fa-calendar-check me-2"></i>
                            Agendamentos do Dia
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="loading" id="loadingAgendamentos">
                            <i class="fas fa-spinner fa-spin fa-2x"></i>
                            <p>Carregando agendamentos...</p>
                        </div>
                        <div id="listaAgendamentos" style="display: none;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna de Controles -->
            <div class="col-lg-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <h4 class="mb-0">
                            <i class="fa-solid fa-info-circle me-2"></i>
                            Informações da Sessão
                        </h4>
                    </div>
                    <div class="card-body">
                        <div id="infoVazia" class="empty-state">
                            <i class="fa-solid fa-calendar-plus fa-3x mb-3"></i>
                            <p>Selecione um agendamento para ver os detalhes</p>
                        </div>
                        <div id="infoAgendamento" style="display: none;">
                            <div class="info-box">
                                <h5>Cliente</h5>
                                <p id="infoCliente" class="fs-5">-</p>
                            </div>
                            <div class="info-box">
                                <h5>Serviço</h5>
                                <p id="infoServico" class="fs-5">-</p>
                            </div>
                            <div class="info-box">
                                <h5>Horário</h5>
                                <p id="infoHorario" class="fs-5">-</p>
                            </div>
                            <div class="info-box">
                                <h5>Duração</h5>
                                <p id="infoDuracao" class="fs-5">-</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Selecionar o posto -->
                <div class="col-lg-6">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h4 class="mb-0">
                                <i class="fa-solid fa-couch me-2"></i>
                                Selecionar Posto de Atendimento
                            </h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="selectPosto" class="form-label">Posto Disponível:</label>
                                <select id="selectPosto" class="form-select">
                                    <option value="">Selecione um posto...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Timer (inciar sessão etc) -->
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fa-solid fa-stopwatch me-2"></i>
                        Controle de Sessão
                    </h4>
                </div>
                <div class="card-body">
                    <div class="timer-container">
                        <h4 id="timerTitulo">Pronto para iniciar</h4>
                        <div class="timer-display" id="timerDisplay">
                            00:00
                        </div>
                        <div class="timer-botoes">
                            <button id="btnIniciar" class="btn btn-sessao btn-iniciar" disabled>
                                <i class="fa-solid fa-play me-2"></i>Iniciar Sessão
                            </button>
                            <button id="btnFinalizar" class="btn btn-sessao btn-finalizar" disabled>
                                <i class="fa-solid fa-stop me-2"></i>Finalizar Sessão
                            </button>
                            <button id="btnPausa" class="btn btn-sessao btn-pausa" style="display: none;">
                                <i class="fa-solid fa-clock me-2"></i>Pausa: <span id="timerPausa">10:00</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/terapeuta.js"></script>

</body>

</html>
