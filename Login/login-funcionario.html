<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login Corporativo - Rokuzen</title>

  <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="JavaScript/loginAdm.js">
  <script src="https://kit.fontawesome.com/a27cc7b249.js" crossorigin="anonymous"></script>

</head>
<body>
  <div class="container">
    <a href="javascript:history.back()" class="back-button">&lt;</a>

    <div class="form-box m-20">
      <h1 id="title">Login Corporativo</h1>

      <form id="loginFuncionarioForm">
        <div class="input-group">
          <div class="input-field">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="email" placeholder="Email corporativo" required>
          </div>

          <div class="input-field">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="entrarFuncionarioBtn" class="button">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
