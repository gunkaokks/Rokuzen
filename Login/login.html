<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rokuzen</title>

    <link rel="shortcut icon" href="../Imagens/LogoTopo.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <script src="https://kit.fontawesome.com/a27cc7b249.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-button">&lt;</a>
    

        <div class="form-box m-20">
            <h1 id="title">Login</h1>

            <!-- Formulário de Login -->
            <form id="loginForm">
                <div class="btn-field">
                    <button type="button" id="signupBtn" class="button">Login</button>
                    <button type="button" id="signinBtn" class="button disable">Cadastro</button>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
                    </div>

                    <p>Esqueceu a senha? <a href="/Login/esqueceusenha.html">Clique Aqui</a></p>
                </div>

                <button type="submit" id="entrarBtn" class="button">Entrar</button>
            </form>

            <!-- Formulário de Cadastro -->
            <form id="signupForm" style="display: none;">
                <div class="btn-field">
                    <button type="button" id="signupBtn2" class="button disable">Login</button>
                    <button type="button" id="signinBtn2" class="button">Cadastro</button>
                </div>

                <div class="input-group" style="height: auto;">
                    <div class="input-field" id="nameField">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="nome" placeholder="Nome" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="telefone" placeholder="Telefone" required>
                    </div>

                    <div class="input-field">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="senha" placeholder="Senha" required>
                    </div>
                </div>

                <button type="submit" id="cadastrarBtn" class="button">Cadastrar</button>
            </form>
        </div>
    </div>

    <a href="/Login/login-funcionario.html" class="staff-login-link">Acesso do Funcionário</a>

    <script src="../JavaScript/login.js"></script>
</body>
</html>
